name: One-time Markdown Notes Refactor
on:
  push:
    paths:
      - .github/workflows/notes-refactor.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Simplify existing notes and rename study maps
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          unit_dirs = sorted(root.glob('01-Semester-1/*/Units/Unit-??'))
          converted = 0
          for folder in unit_dirs:
              unit_match = re.search(r'Unit-(\d\d)$', folder.name)
              if not unit_match:
                  continue
              num = int(unit_match.group(1))
              main = next((p for p in sorted(folder.glob('00 - *.md'))), None)
              if main is None:
                  continue
              topics = sorted([p for p in folder.glob('*.md') if not p.name.startswith('00 - ')])
              for ix, path in enumerate(topics):
                  old = path.read_text(encoding='utf-8-sig')
                  if not re.search(r'^type:\s*syllabus-topic\s*$', old, re.M):
                      continue
                  title_match = re.search(r'^# (.+)$', old, re.M)
                  title = title_match.group(1).strip() if title_match else path.stem
                  match = re.search(r'^subject:\s*(.+)$', old, re.M)
                  subject = match.group(1) if match else '"' + folder.parent.parent.name + '"'
                  source = re.search(r'^source_page:\s*(\d+)$', old, re.M)
                  words = [v.strip() for v in re.split(r'\s+(?:and|or|versus)\s+|,\s*|:\s*', title, flags=re.I) if v.strip()]
                  points = list(dict.fromkeys(words))[:9]
                  link = lambda p, text: '[[' + p.as_posix()[:-3] + '|' + text + ']]'
                  related = ['- ' + link(main, 'Unit ' + str(num))]
                  if ix:
                      related.append('- ' + link(topics[ix - 1], 'Previous topic'))
                  if ix + 1 < len(topics):
                      related.append('- ' + link(topics[ix + 1], 'Next topic'))
                  page = [
                      '---', 'type: note', 'semester: 1', 'unit: ' + str(num),
                      'subject: ' + subject, 'status: outline',
                      'tags: [law-notes, topics]', '---', '', '# ' + title, '',
                      '## Key terms', '',
                  ] + ['- ' + x for x in points] + ['', '## Related', ''] + related + ['']
                  path.write_text('\n'.join(page), encoding='utf-8')
                  converted += 1

          books = 0
          for path in root.glob('10-Books-and-Reading/Catalog/**/*.md'):
              old = path.read_text(encoding='utf-8-sig')
              if not re.search(r'^type:\s*bibliography\s*$', old, re.M):
                  continue
              heading = re.search(r'^# (.+)$', old, re.M)
              course = re.search(r'^\*\*Course:\*\*\s*(.+)$', old, re.M)
              classification = re.search(r'^classification:\s*(.+)$', old, re.M)
              lines = ['---', 'type: book-reference', 'tags: [law-notes, books]', '---', '',
                  '# ' + (heading.group(1) if heading else path.stem), '',
                  '## Details', '',
                  '- ' + (classification.group(1).strip('"') if classification else 'Reading list')]
              if course:
                  lines.append('- ' + course.group(1))
              lines += ['']
              path.write_text('\n'.join(lines), encoding='utf-8')
              books += 1

          old = root / '08-Brain-Branches/Syllabus-From-Uploaded-PDF'
          new = root / '08-Brain-Branches/Notes-Maps'
          maps = 0
          if old.exists():
              new.parent.mkdir(parents=True, exist_ok=True)
              if new.exists():
                  raise RuntimeError('Target Notes-Maps already exists; refusing to overwrite')
              maps = len(list(old.rglob('*.canvas')))
              old.rename(new)

          original = root / '00-Dashboard/Coverage Status.md'
          target = root / '00-Dashboard/Notes Overview.md'
          if original.exists():
              if target.exists():
                  raise RuntimeError('Notes Overview already exists')
              original.rename(target)

          oldnew = {
              '08-Brain-Branches/Syllabus-From-Uploaded-PDF/': '08-Brain-Branches/Notes-Maps/',
              '01-Semester-1/00 - Semester I Syllabus Index': '01-Semester-1/00 - Semester I Notes',
              'HOME - Start Here': '00 - Notes',
              '00-Dashboard/Coverage Status': '00-Dashboard/Notes Overview',
              '02-Semester-2/Contract-II/00 - Contract II - Special Contracts': '02-Semester-2/Contract-II---Special-Contracts/00 - Contract II - Special Contracts',
          }
          replacements = 0
          for extension in ('.md', '.canvas', '.json'):
              for path in root.rglob('*' + extension):
                  if '.git' in path.parts or '.github' in path.parts:
                      continue
                  contents = path.read_text(encoding='utf-8-sig')
                  changed = contents
                  for a,b in oldnew.items():
                      changed = changed.replace(a,b)
                  if changed != contents:
                      path.write_text(changed, encoding='utf-8')
                      replacements += 1

          assert (root / '00 - Notes.md').exists()
          assert (root / '01-Semester-1/00 - Semester I Notes.md').exists()
          assert len(list(root.glob('01-Semester-1/*/Units/Unit-??/00 - *.md'))) == 30
          print('Converted topic outlines:', converted)
          print('Shortened book references:', books)
          print('Moved Canvas maps:', maps)
          print('Updated Markdown/Canvas/JSON references:', replacements)
          PY
      - name: Repair Canvas links in existing Markdown
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          count=0
          for p in Path('.').rglob('*.md'):
              s=p.read_text(encoding='utf-8-sig')
              t=re.sub(r'\[\[(08-Brain-Branches/Notes-Maps/[^|\]]+?)(?<!\.canvas)\|',lambda m:'[['+m.group(1)+'.canvas|',s)
              if t!=s:
                  p.write_text(t,encoding='utf-8')
                  count+=1
          print('Updated Canvas note links:',count)
          PY
      - name: Commit refactored notes
        shell: bash
        run: |
          git config user.name "LAW-NOTES refactor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "notes: compact topic pages, bibliography and rename study maps"
            git push origin HEAD:main
          fi
